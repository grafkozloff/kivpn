# На Windows SQLite WAL-файлы во временном каталоге бывают заблокированы (антивирус/индексатор),
# из-за чего автоочистка @TempDir падает с DirectoryNotEmptyException. Отключаем автоочистку:
# временные каталоги остаются в %TEMP% и убираются средствами ОС.
junit.jupiter.tempdir.cleanup.mode.default=never
